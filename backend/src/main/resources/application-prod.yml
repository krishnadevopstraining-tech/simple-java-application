spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 20

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example: INFO
  file:
    name: /var/log/application.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
